<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fysiodex - Klachtenbeelden</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../navbarfooter.css">
    <link rel="stylesheet" href="klachtenbeelden.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container"></div>
    </nav>

    <div class="intro">
        <div class="container">
            <h2>Ontdek het lichaam</h2>
            <p>Klik op een gebied om meer informatie te bekijken.</p>
        </div>
    </div>

    <!-- 3D Container -->
    <div class="image-container">
        <div id="model-container"></div>
        <div id="hotspots"></div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <footer class="site-footer">
        <div class="footer-divider"></div>

        <div class="footer-content">
            <div class="footer-section">
                <h3 id="footer-company-name"></h3>
                <p id="footer-tagline"></p>
                <div class="footer-social">
                    <a href="#" id="footer-social-fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" id="footer-social-ig"><i class="fab fa-instagram"></i></a>
                    <a href="#" id="footer-social-li"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="footer-section">
                <h3>Snelle links</h3>
                <ul id="footer-quicklinks"></ul>
            </div>

            <div class="footer-section">
                <h3>Contact</h3>
                <p id="footer-address"></p>
                <p id="footer-phone"></p>
                <p id="footer-email"></p>
            </div>
        </div>

        <div class="footer-bottom">
            <p id="footer-copyright"></p>
        </div>
    </footer>
    
    <script type="module" src="../scripts/model.js"></script>
    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/footer.js"></script>
</body>

</html>
