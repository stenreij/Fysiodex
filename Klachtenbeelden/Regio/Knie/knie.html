<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fysiodex - Knie Specialisatie</title>

    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="../../../navbarfooter.css">
    <link rel="stylesheet" href="../regio.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

    <nav class="navbar">
        <div class="nav-container"></div>
    </nav>

    <div class="container">
        <h1>Knie Specialisatie</h1>

        <div class="knee-wrapper">
            <svg viewBox="-10 -10 120 120">
                <!-- Part 1 - Top right (Pathology) -->
                <g class="segment-group segment-group-1">
                    <path class="segment segment-1"
                        d="M50 50 L50 0 A50 50 0 0 1 93 75 Z" />
                    <text class="segment-text" y="35" text-anchor="middle">
                        <tspan x="75" dy="-4">Pathologie &</tspan>
                        <tspan x="75" dy="4">Diagnostiek</tspan>
                    </text>
                    <text class="hover-text-inline hover-inline-1" y="35" text-anchor="middle">
                        <tspan x="75" dy="-4">Pathologie &</tspan>
                        <tspan x="75" dy="4">Diagnostiek</tspan>
                    </text>
                </g>

                <!-- Part 2 - Bottom middle (Treatment) -->
                <g class="segment-group segment-group-2">
                    <path class="segment segment-2"
                        d="M50 50 L93 75 A50 50 0 0 1 7 75 Z" />
                    <text class="segment-text" x="50" y="80" text-anchor="middle">Behandeling</text>
                    <text class="hover-text-inline hover-inline-2" x="50" y="80" text-anchor="middle">Behandeling</text>
                </g>

                <!-- Part 3 - Top left (Anatomy) -->
                <g class="segment-group segment-group-3">
                    <path class="segment segment-3"
                        d="M50 50 L7 75 A50 50 0 0 1 50 0 Z" />
                    <text class="segment-text" y="35" text-anchor="middle">
                        <tspan x="25" dy="-4">Anatomie &</tspan>
                        <tspan x="25" dy="4">Fysiologie</tspan>
                    </text>
                    <text class="hover-text-inline hover-inline-3" y="35" text-anchor="middle">
                        <tspan x="25" dy="-4">Anatomie &</tspan>
                        <tspan x="25" dy="4">Fysiologie</tspan>
                    </text>
                </g>
            </svg>

            <div class="center-text">De Knie</div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-divider"></div>
        <div class="footer-content">
            <div class="footer-section">
                <h3 id="footer-company-name"></h3>
                <p id="footer-tagline"></p>
                <div class="footer-social">
                    <a href="#" id="footer-social-fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" id="footer-social-ig"><i class="fab fa-instagram"></i></a>
                    <a href="#" id="footer-social-li"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            <div class="footer-section">
                <h3>Snelle links</h3>
                <ul id="footer-quicklinks"></ul>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p id="footer-address"></p>
                <p id="footer-phone"></p>
                <p id="footer-email"></p>
            </div>
        </div>
        <div class="footer-bottom">
            <p id="footer-copyright"></p>
        </div>
    </footer>

    <script src="../../../scripts/footer.js"></script>
    <script src="../../../scripts/navbar.js"></script>

</body>

</html>
